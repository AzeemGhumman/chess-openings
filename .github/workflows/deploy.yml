name: Deploy to S3

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Download Stockfish WASM from S3
        run: aws s3 cp s3://chess-azeemghumman/stockfish/stockfish-18-single.wasm app/public/stockfish/stockfish-18-single.wasm

      - name: Build
        run: npm run build
        working-directory: app

      - name: Sync to S3
        run: aws s3 sync app/dist s3://chess-azeemghumman --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E4PRH9O5BBRSP --paths "/*"
